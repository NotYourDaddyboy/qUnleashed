```yaml
name: Build qUnleashed Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Configure MSVC compatibility
        shell: powershell
        run: |
          $env:CXXFLAGS="/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          $env:CFLAGS="/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          Add-Content $env:GITHUB_ENV "CXXFLAGS=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          Add-Content $env:GITHUB_ENV "CFLAGS=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip application
        shell: powershell
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "qUnleashed-Windows.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: qUnleashed-Windows
          path: qUnleashed-Windows.zip
```
